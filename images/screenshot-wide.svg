<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#151515"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="270" height="720" fill="#222222"/>
  
  <!-- Logo -->
  <text x="135" y="60" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">
    <tspan fill="#ec1839" font-size="32">p</tspan>ortfolio
  </text>
  
  <!-- Nav items -->
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="16" fill="#ec1839">⌂ Home</text>
  <text x="40" y="290" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">👤 About</text>
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">✎ Articles</text>
  <text x="40" y="370" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">💼 Portfolio</text>
  <text x="40" y="410" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">💬 Contact</text>
  
  <!-- Main content area -->
  <text x="640" y="200" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">Hello, my name is</text>
  <text x="640" y="260" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ec1839" text-anchor="middle">Aryan Dev Shourie</text>
  <text x="640" y="320" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">I am a Frontend Developer</text>
  
  <!-- Description -->
  <text x="640" y="400" font-family="Arial, sans-serif" font-size="16" fill="#e9e9e9" text-anchor="middle">A detail-oriented Frontend Software Engineer dedicated to</text>
  <text x="640" y="430" font-family="Arial, sans-serif" font-size="16" fill="#e9e9e9" text-anchor="middle">delivering seamless and visually engaging web applications.</text>
  
  <!-- Button -->
  <rect x="560" y="480" width="160" height="50" rx="25" fill="#ec1839"/>
  <text x="640" y="512" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Hire Me</text>
</svg>
